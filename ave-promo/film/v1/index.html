<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AVE Studio Promo</title>
<style>
@font-face{font-family:InterD;src:url(fonts/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:InterD;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:InterD;src:url(fonts/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:InterD;src:url(fonts/InterDisplay-ExtraBold.otf);font-weight:800}
@font-face{font-family:Serif;src:url(fonts/InstrumentSerif-italic-400.woff2);font-style:italic;font-weight:400}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-normal-400.woff2);font-weight:100 800}
:root{--ink:#0E0E0E;--off:#F3F2EE;--lime:#C8FF2E;--mute:#6E6C66;--line:#E3E1DB;--tile:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--off);font-family:InterD,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px}
.a{position:absolute}
.mono{font-family:Mono,monospace;text-transform:uppercase;letter-spacing:.12em}
.serif{font-family:Serif,serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .14em .16em 0;margin-right:-.14em}
.wi{display:inline-block;will-change:transform}
.catwrap{position:absolute;left:0;top:0;transform-origin:0 0}
.catwrap canvas{position:absolute;left:0;top:0}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(40,36,30,.30),rgba(40,36,30,.12) 55%,rgba(40,36,30,0))}
/* cards */
.card{position:absolute;width:400px;height:540px;border-radius:22px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04),0 30px 60px -20px rgba(30,28,24,.28),0 10px 24px -12px rgba(30,28,24,.18);overflow:hidden;backface-visibility:hidden}
.card .vis{position:absolute;left:20px;top:70px;width:360px;height:236px;border-radius:14px;overflow:hidden}
.card .idx{position:absolute;left:24px;top:26px;font-size:16px;color:var(--mute)}
.card .num{position:absolute;right:24px;top:24px;font-size:16px;color:var(--ink)}
.card h3{position:absolute;left:24px;top:338px;font-size:58px;font-weight:600;letter-spacing:-.03em}
.card .sub{position:absolute;left:26px;top:420px;font-size:18px;color:var(--mute);letter-spacing:.06em;line-height:1.5;text-transform:none}
/* dashboard */
.tile{position:absolute;background:#fff;border-radius:22px;border:1px solid #E6E4DE;box-shadow:0 18px 40px -26px rgba(30,28,24,.30);overflow:hidden}
.tile .hd{position:absolute;left:24px;top:22px;font-size:16px;color:#6B6964;letter-spacing:.14em}
.tile .dot{position:absolute;right:22px;top:22px;width:14px;height:14px;border-radius:50%;background:#D6D4CD}
.pill{position:absolute;border-radius:999px;font-family:Mono,monospace;font-size:14px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center}
.chk{position:absolute;width:26px;height:26px;border-radius:8px;border:2px solid #CFCDC6;background:#fff}
.plat{position:absolute;font-size:21px;font-weight:600;letter-spacing:-.01em}
.platsub{position:absolute;font-size:11px;color:#8A877F}
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="dblur" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur id="dblurG" stdDeviation="0 0"/></filter>
  </defs>
</svg>
<script src="cues.js"></script>
<script>
'use strict';
const C = window.CUES;
const stage = document.getElementById('stage');
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  outCubic:x=>1-Math.pow(1-x,3), outQuart:x=>1-Math.pow(1-x,4), outQuint:x=>1-Math.pow(1-x,5),
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inCubic:x=>x*x*x, inQuad:x=>x*x, outQuad:x=>1-(1-x)*(1-x), inQuart:x=>x*x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, inOutQuart:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2, outSine:x=>Math.sin(x*Math.PI/2),
  outBack:(x,s=1.5)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
};
// damped spring 0->1, x in seconds since start
function spring(x,f=2,z=.5){ if(x<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+(z*w/wd)*Math.sin(wd*x)); }
// decaying wiggle (for follow-through), starts at 0
function wiggle(x,f=3,z=.35){ if(x<=0) return 0; const w=2*Math.PI*f; return Math.exp(-z*w*x)*Math.sin(w*Math.sqrt(1-z*z)*x); }
function mulberry32(a){return function(){a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(seed)=>mulberry32(seed)();
const seededList=(seed,n)=>{const r=mulberry32(seed);return Array.from({length:n},()=>r());};
// smooth value noise for "talking" mouths etc.
function vnoise(seed,x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(rnd(seed*7919+i),rnd(seed*7919+i+1),u);}

// ---------- dom helpers ----------
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}
function css(e,o){for(const k in o)e.style[k]=o[k];return e;}
function show(e,on){e.style.display=on?'':'none';}
function layer(z){const l=el('div','L');l.style.zIndex=z;return l;}
// split text into masked words. returns [{w,wi}]
function words(parent,text,cls){const out=[];text.split(' ').forEach((t,i,arr)=>{const w=el('span','w '+(cls||''),parent);const wi=el('span','wi',w,t);out.push({w,wi});if(i<arr.length-1)parent.appendChild(document.createTextNode(' '));});return out;}
function revealUp(ws,t,t0,stag=.07,dur=.6,track=true){ws.forEach((o,i)=>{const p=E.outExpo(P(t,t0+i*stag,t0+i*stag+dur));o.wi.style.transform=`translateY(${(1-p)*108}%)`;if(track)o.wi.style.letterSpacing=`${lerp(.06,0,E.outCubic(P(t,t0+i*stag,t0+i*stag+dur*1.2)))}em`;});}
function exitUp(ws,t,t0,stag=.03,dur=.28){ws.forEach((o,i)=>{const p=E.inCubic(P(t,t0+i*stag,t0+i*stag+dur));if(p>0)o.wi.style.transform=`translateY(${-p*110}%)`;});}

// ---------- WebGL cat rig ----------
const VS=`#version 300 es
in vec2 a; out vec2 v; void main(){ v=vec2(a.x*.5+.5, .5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
const FS=`#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D T; uniform vec2 S; uniform vec4 L;
uniform vec4 B0r; uniform vec4 B0p; uniform vec4 B1r; uniform vec4 B1p;
uniform vec4 E0; uniform vec4 E1; uniform float lid; uniform vec3 LC0; uniform vec3 LC1; uniform vec2 ET;
vec2 rot(vec2 p, vec2 c, float a){ float s=sin(a), k=cos(a); p-=c; return c+vec2(k*p.x-s*p.y, s*p.x+k*p.y); }
float wt(vec2 p, vec4 R, float f){ if(R.z<=0.) return 0.; float d=length((p-R.xy)/R.zw); return 1.-smoothstep(1.,1.+f,d); }
vec4 samp(vec2 s){ if(s.x<0.||s.y<0.||s.x>S.x||s.y>S.y) return vec4(0.); return texture(T, s/S); }
vec4 lidc(vec4 c, vec2 s, vec4 E, vec3 LC, float tilt){
  if(E.z<=0.||lid<=.001) return c;
  vec2 q=(s-E.xy)/E.zw; float sn=sin(tilt), cs=cos(tilt); q=vec2(cs*q.x-sn*q.y, sn*q.x+cs*q.y);
  float r=length(q); float inside=1.-smoothstep(.95,1.05,r);
  float yl=mix(-1.2,.30,lid)+.28*lid*q.x*q.x;
  float above=1.-smoothstep(yl-.03,yl+.03,q.y);
  vec3 col=mix(LC, LC*.80, smoothstep(yl-.7,yl,q.y));
  float lash=(1.-smoothstep(0.,.10,abs(q.y-yl)))*smoothstep(.2,.55,lid)*inside*(1.-smoothstep(.85,1.,abs(q.x)));
  vec3 res=mix(c.rgb, col*c.a, above*inside);
  res=mix(res, vec3(.16,.10,.06)*c.a, lash*.9);
  return vec4(res,c.a);
}
void main(){
  vec2 p=mix(L.xy,L.zw,v); vec2 s=p;
  float w0=wt(p,B0r,B0p.w); s=rot(s,B0p.xy,-B0p.z*w0);
  float w1=wt(p,B1r,B1p.w); s=rot(s,B1p.xy,-B1p.z*w1);
  vec4 c=samp(s);
  c=lidc(c,s,E0,LC0,ET.x); c=lidc(c,s,E1,LC1,ET.y);
  o=c;
}`;
class Cat{
  constructor(img,rig={},opts={}){
    this.img=img;this.rig=rig;this.W=img.naturalWidth;this.H=img.naturalHeight;
    const pad=rig.pad||[.1,.05];
    this.lo=[-pad[0]*this.W,-pad[1]*this.H];this.hi=[this.W*(1+pad[0]),this.H*(1+pad[1])];
    this.cw=this.hi[0]-this.lo[0];this.ch=this.hi[1]-this.lo[1];
    this.wrap=el('div','catwrap',opts.parent);
    this.cv=el('canvas',null,this.wrap);
    const res=opts.res||.75;
    this.cv.width=Math.round(this.cw*res);this.cv.height=Math.round(this.ch*res);
    css(this.cv,{width:this.cw+'px',height:this.ch+'px',left:this.lo[0]+'px',top:this.lo[1]+'px'});
    if(opts.flip) this.flip=true;
    const gl=this.gl=this.cv.getContext('webgl2',{premultipliedAlpha:true,alpha:true,preserveDrawingBuffer:true,antialias:false});
    const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
    const pr=this.pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    this.u={};['T','S','L','B0r','B0p','B1r','B1p','E0','E1','lid','LC0','LC1','ET'].forEach(n=>this.u[n]=gl.getUniformLocation(pr,n));
    gl.uniform2f(this.u.S,this.W,this.H);gl.uniform4f(this.u.L,this.lo[0],this.lo[1],this.hi[0],this.hi[1]);
    this.last='';
  }
  // pose: {b0:angleRad, b1:angleRad, lid:0..1}
  draw(pose={}){
    const key=JSON.stringify(pose);if(key===this.last)return;this.last=key;
    const gl=this.gl,u=this.u,r=this.rig;
    gl.viewport(0,0,this.cv.width,this.cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    const z4=[0,0,0,0];
    const b0=r.b0, b1=r.b1;
    gl.uniform4fv(u.B0r,b0?b0.r:z4);gl.uniform4fv(u.B0p,b0?[b0.p[0],b0.p[1],pose.b0||0,b0.f]:z4);
    gl.uniform4fv(u.B1r,b1?b1.r:z4);gl.uniform4fv(u.B1p,b1?[b1.p[0],b1.p[1],pose.b1||0,b1.f]:z4);
    const e=r.eyes;
    gl.uniform4fv(u.E0,e?e[0].e:z4);gl.uniform4fv(u.E1,e?e[1].e:z4);
    gl.uniform3fv(u.LC0,e?e[0].c:[0,0,0]);gl.uniform3fv(u.LC1,e?e[1].c:[0,0,0]);
    gl.uniform2fv(u.ET,e?[e[0].t,e[1].t]:[0,0]);gl.uniform1f(u.lid,pose.lid||0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  // place: x,y = stage position of texture origin, s = scale. base = pivot in tex px for rot/squash
  place(x,y,s,o={}){
    const bx=(o.base||[this.W/2,this.H])[0],by=(o.base||[this.W/2,this.H])[1];
    const f=this.flip?`translate(${this.W}px,0) scale(-1,1) `:'';
    this.wrap.style.transform=`translate(${x}px,${y}px) scale(${s}) translate(${bx}px,${by}px) rotate(${o.rot||0}deg) scale(${o.sx||1},${o.sy||1}) translate(${-bx}px,${-by}px) ${f}`;
    this.wrap.style.opacity=o.op==null?1:o.op;
  }
}

// ---------- assets ----------
const IMG={};
function loadImg(n){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='img/'+n+'.png';IMG[n]=i;});}

// ---------- grain ----------
let grain;
function buildGrain(){
  grain=el('div','L');css(grain,{zIndex:900,pointerEvents:'none',mixBlendMode:'overlay',opacity:'.06'});
  const tiles=[];for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=mulberry32(101+k);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);tiles.push(c.toDataURL());}
  grain.tiles=tiles;
}
function updGrain(t){const f=Math.floor(t*C.fps);grain.style.backgroundImage=`url(${grain.tiles[f%4]})`;const r=mulberry32(f*31+7);grain.style.backgroundPosition=`${Math.floor(r()*256)}px ${Math.floor(r()*256)}px`;}

// ======================================================================
// SCENE 1-2 · mascot intro + hook
// ======================================================================
const S12={};
function buildS12(){
  const L=S12.L=layer(10);css(L,{background:'var(--off)'});
  S12.shadow=el('div','shadow',L);
  S12.cat=new Cat(IMG.cat_neutral_f,{
    pad:[.12,.06],
    b0:{r:[440,380,400,335],p:[440,700],f:.35},          // head
    b1:{r:[1010,1300,240,210],p:[770,1330],f:.7},         // tail
    eyes:[{e:[242,437,46,52],c:[.97,.83,.66],t:.06},{e:[493,423,68,54],c:[.93,.68,.45],t:-.10}]
  },{parent:L,res:.62});
  const tx=S12.tx=el('div','a',L);css(tx,{left:'150px',top:'300px'});
  S12.micro=el('div','a mono',tx);css(S12.micro,{left:'4px',top:'0',fontSize:'21px',color:'#6E6C66',whiteSpace:'pre'});
  S12.caret=el('span',null,S12.micro);
  const l1=el('div','a',tx);css(l1,{left:0,top:'54px',fontSize:'128px',fontWeight:600,letterSpacing:'-.04em',lineHeight:'1',whiteSpace:'nowrap'});
  S12.w1=words(l1,'Got something');
  const l2=el('div','a',tx);css(l2,{left:0,top:'192px',fontSize:'128px',fontWeight:600,letterSpacing:'-.04em',lineHeight:'1',whiteSpace:'nowrap'});
  S12.w2=words(l2,'worth');
  const acc=S12.acc=el('span','a',l2);css(acc,{left:'372px',top:'-14px',whiteSpace:'nowrap'});
  S12.swash=el('div','a',acc);css(S12.swash,{left:'-10px',top:'76px',width:'560px',height:'66px',background:'var(--lime)',borderRadius:'8px',transformOrigin:'0 50%'});
  S12.watch=el('span','a serif',acc,'watching?');css(S12.watch,{left:0,top:'-6px',fontSize:'160px',lineHeight:'1',color:'var(--ink)'});
}
function updS12(t){
  const on=t<C.S3+.45; show(S12.L,on); if(!on) return;
  // cat hop-in and settle
  const s=.54, X0=1215, Y0=240;
  const hp=P(t,C.catIn,C.land); const he=E.inOutSine(hp);
  let x=X0+lerp(520,0,E.outCubic(hp)), y=Y0-Math.sin(Math.PI*he)*70*(1-hp*.2);
  let rot=lerp(-9,0,E.outCubic(hp)), sx=1, sy=1;
  if(t>=C.land){const k=t-C.land; rot=-1.8*wiggle(k,2.2,.45); sy=1-.055*Math.exp(-9*k)*Math.cos(14*k); sx=1+.04*Math.exp(-9*k)*Math.cos(14*k);}
  if(t<C.catIn) x=X0+520;
  // glance toward the text, later a curious tilt on "watching?"
  let head=-.075*E.inOutCubic(P(t,C.glance,C.glance+.32));
  head+= .11*(spring(t-C.tilt,1.6,.42))*(t>=C.tilt?1:0);
  head-= .12*E.inOutCubic(P(t,C.hookOut,C.hookOut+.3));
  // breathing
  sy*=1+.005*Math.sin(t*2*Math.PI/2.4);
  // tail flick
  const tail=.20*wiggle(t-C.tailFlick,1.5,.32)+.10*wiggle(t-(C.tilt+.12),1.6,.4);
  // blink
  const bk=t-C.blink1; let lid=0; if(bk>0&&bk<.145) lid=bk<.04?E.inQuad(bk/.04):bk<.075?1:1-E.outQuad((bk-.075)/.07);
  const bk2=t-(C.watching-.42); if(bk2>0&&bk2<.14) lid=Math.max(lid,bk2<.04?bk2/.04:bk2<.07?1:1-(bk2-.07)/.07);
  // exit right when cards come (cat swaps to presenting pose)
  const xo=P(t,C.S3,C.S3+.12); const op=1-xo;
  S12.cat.draw({b0:head,b1:tail,lid});
  S12.cat.place(x,y,s,{base:[600,1490],rot,sx,sy,op});
  const hgt=1-Math.sin(Math.PI*he)*(1-hp*.2);
  css(S12.shadow,{left:(x+600*s-280)+'px',top:(Y0+1478*s-30)+'px',width:'600px',height:'64px',opacity:(.25+.75*(t<C.land?hgt:1))*op,transform:`scaleX(${t<C.land?lerp(.7,1,hgt):1})`});
  // microtype typing
  const txt='// AVE STUDIO'; const n=Math.floor(clamp((t-C.micro)/.028,0,txt.length));
  S12.micro.firstChild&&S12.micro.firstChild.nodeType===3?S12.micro.firstChild.nodeValue=txt.slice(0,n):S12.micro.insertBefore(document.createTextNode(txt.slice(0,n)),S12.caret);
  S12.caret.textContent=(n<txt.length&&t>C.micro)||(Math.floor(t*3)%2===0&&t<C.got+.4&&t>C.micro)?'▍':'';
  S12.caret.style.color='#B9B7B0';
  S12.micro.style.opacity=1-P(t,C.hookOut,C.hookOut+.2);
  // headline
  revealUp(S12.w1,t,C.got,.075,.62);
  revealUp(S12.w2,t,C.worth,0,.6);
  exitUp(S12.w1,t,C.hookOut,.03); exitUp(S12.w2,t,C.hookOut+.06,.03);
  // accent word glides in (no mask, no bounce)
  const g=E.outQuint(P(t,C.watching,C.watching+.55));
  css(S12.watch,{transform:`translateX(${(1-g)*70}px)`,filter:`blur(${(1-g)*12}px)`,opacity:P(t,C.watching,C.watching+.18)});
  const sw=E.outExpo(P(t,C.watching+.08,C.watching+.5));
  const swOut=E.inCubic(P(t,C.hookOut,C.hookOut+.26));
  css(S12.swash,{transform:`skewX(-10deg) scaleX(${sw*(1-swOut)})`,transformOrigin:swOut>0?'100% 50%':'0 50%'});
  S12.watch.style.transform+=` translateY(${-E.inCubic(P(t,C.hookOut+.1,C.hookOut+.38))*180}px)`;
  S12.watch.style.opacity=Math.min(+S12.watch.style.opacity,1-P(t,C.hookOut+.1,C.hookOut+.3));
}

// ======================================================================
// SCENE 3-4 · service cards -> raw footage becomes an AVE edit
// ======================================================================
const S34={};
const CARD=[
  {n:'01',k:'COMEDY',title:'Comedy',sub:'Timing • Punchlines • Personality'},
  {n:'02',k:'PODCASTS',title:'Podcasts',sub:'Conversations → Shorts'},
  {n:'03',k:'CREATORS',title:'Creators',sub:'Long-form → Short-form'},
];
function personSVG(o={}){
  // flat-3D talking head; ids prefixed
  const p=o.id||'p', skin=o.skin||['#E9B794','#CF9471'], shirt=o.shirt||['#2E333B','#1C2026'], hair=o.hair||'#2A1D16';

  S7.calm.draw({});S7.calm.place(1060+(1-ci)*120,250,.56,{base:[734,1490],sy:br,op:ci*(1-sw)});
  const pop=1+.03*wiggle(k,3,.5);
  S7.conf.draw({b0:-.05*E.outBack(P(t,C.hit,C.hit+.3))});
  S7.conf.place(1170,215,.76,{base:[342,1106],sx:pop,sy:2-pop,op:sw});
}

const CTA={x:150,y:640,w:600,h:128};
function updS8(t){
  const on=t>=C.S8-.02; show(S8.L,on); if(!on) return;
  // black brand frame closes onto the CTA pill (S7 is clipped by the same shape)
  const k=E.inOutQuart(P(t,C.S8,C.S8+.46));
  const x=lerp(0,CTA.x,k),y=lerp(0,CTA.y,k),w=lerp(1920,CTA.w,k),h=lerp(1080,CTA.h,k),r=lerp(0,64,k);
  S7.L.style.clipPath=`inset(${y}px ${1920-x-w}px ${1080-y-h}px ${x}px round ${r}px)`;
  S7.cam.style.opacity=1-P(t,C.S8,C.S8+.3);
  S8.pill.style.opacity=t>=C.S8+.45?1:0;
  // elements
  const lp=E.outExpo(P(t,C.S8+.18,C.S8+.8));
  ['lgA','lgV','lgE'].forEach((id,i)=>{const p=E.outExpo(P(t,C.S8+.16+i*.06,C.S8+.7+i*.06));const e=S8.logo.querySelector('#'+id);e.style.transform=`translateY(${(1-p)*130}px)`;});
  S8.logo.style.clipPath='inset(0 0 0 0)';S8.logo.querySelector('svg').style.overflow='hidden';
  css(S8.studio,{opacity:P(t,C.S8+.36,C.S8+.5),letterSpacing:`${lerp(.7,.42,E.outQuint(P(t,C.S8+.36,C.S8+.9)))}em`});
  revealUp(S8.t1,t,C.S8+.3,.07,.6);
  S8.t2.forEach((o,i)=>{const g=E.outQuint(P(t,C.S8+.44+i*.08,C.S8+.9+i*.08));css(o.wi,{transform:`translateX(${(1-g)*50}px)`,filter:`blur(${(1-g)*8}px)`,opacity:P(t,C.S8+.44+i*.08,C.S8+.56+i*.08)});});
  css(S8.svc,{opacity:P(t,C.S8+.55,C.S8+.7),transform:`translateY(${(1-E.outQuint(P(t,C.S8+.55,C.S8+.9)))*12}px)`});
  const cp=E.outQuint(P(t,C.cta,C.cta+.3));css(S8.ctaT,{opacity:P(t,C.cta,C.cta+.12),transform:`translateY(${(1-cp)*14}px)`,letterSpacing:`${lerp(.12,.01,cp)}em`});
  css(S8.pill,{transform:`scale(${1+.04*wiggle(t-C.cta,3,.5)})`});
  css(S8.small,{opacity:P(t,C.cta+.12,C.cta+.3),transform:`translateY(${(1-E.outQuint(P(t,C.cta+.12,C.cta+.5)))*12}px)`});
  // friendly cat: rises in, waves, then sits still
  const ci=spring(t-(C.S8+.12),1.5,.6);
  const wv=t-C.wave1; const env=P(t,C.wave1,C.wave1+.15)*(1-E.inOutSine(P(t,C.wave1+.95,C.wave1+1.3)));
  const paw=.16*Math.sin(wv*2*Math.PI*2.1)*env;
  S8.cat.draw({b0:paw});
  const s=.7, X=1220, Y=262+(1-ci)*240;
  S8.cat.place(X,Y,s,{base:[460,1106],op:P(t,C.S8+.12,C.S8+.22)});
  css(S8.shadow,{left:(X+460*s-260)+'px',top:(262+1100*s-30)+'px',width:'520px',height:'60px',opacity:P(t,C.S8+.2,C.S8+.5)});
}

async function init(){
  await Promise.all(['cat_neutral_f','cat_present_f','cat_focus_front_f','cat_calm_f','cat_confident_f','cat_wave_f'].map(loadImg));
  await document.fonts.load('600 40px InterD');await document.fonts.load('800 40px InterD');await document.fonts.load('700 40px InterD');await document.fonts.load('500 40px InterD');
  await document.fonts.load('italic 40px Serif');await document.fonts.load('40px Mono');await document.fonts.ready;
  buildS12();S12.acc.style.left=(S12.w2[0].w.getBoundingClientRect().width+34)+'px';S12.swash.style.width=(S12.watch.getBoundingClientRect().width+16)+'px';buildS34();buildS5();buildS6();buildS7();buildS8();buildGrain();
  window.seek=async(t)=>{updS12(t);updS34(t);updS5(t);updS6(t);updS7(t);updS8(t);updGrain(t);};
  const q=new URLSearchParams(location.search);
  if(q.has('t')) window.seek(parseFloat(q.get('t')));
  else if(q.has('play')){const t0=performance.now();const loop=()=>{const t=((performance.now()-t0)/1000)%C.dur;window.seek(t);requestAnimationFrame(loop);};loop();}
  else window.seek(0);
  window.READY=true;
}
init().catch(e=>{window.INITERR=String(e&&e.stack||e);console.error(e);});

'use strict';
const C=window.CUES, stage=document.getElementById('stage');
// ---------------- math ----------------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t, P=(t,a,b)=>clamp((t-a)/(b-a));

function css(e,o){for(const k in o)e.style[k]=o[k];return e;}

// ---------------- footage ----------------
const CLIPN={card_comedy:121,card_motion:120,card_podcast:120,feed_conor:127,feed_jackie:127,feed_kt:126,feed_roast:126,feed_sp:126,flash_kt:58,flash_sp:57,hero_motion:138,longform:138,mp_edit:222,mp_raw:222};
let pending=[];
function clip(img,name,lt,loop=false){const n=CLIPN[name];let i=Math.floor(lt*30+1e-6)+1;if(loop)i=((i-1)%n+n)%n+1;i=Math.max(1,Math.min(n,i));

function vid(parent,cls){const i=el('img',cls||'vid',parent);i.alt='';return i;}
// ---------------- WebGL cat rig (bones: rotate / move; lids; mouth) ----------------
const VS=`#version 300 es
in vec2 a; out vec2 v; void main(){ v=vec2(a.x*.5+.5,.5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
const FS=`#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D T; uniform vec2 S; uniform vec4 L; uniform int NB;
uniform vec4 BR[10]; uniform vec4 BP[10]; uniform vec3 BV[10];
uniform vec4 E0; uniform vec4 E1; uniform float lid; uniform vec3 LC0; uniform vec3 LC1; uniform vec2 ET;
uniform vec4 MO; uniform float mopen;
vec2 rot(vec2 p,vec2 c,float a){float s=sin(a),k=cos(a);p-=c;return c+vec2(k*p.x-s*p.y,s*p.x+k*p.y);}
float wt(vec2 p,vec4 R,float f){float d=length((p-R.xy)/R.zw);return 1.-smoothstep(1.,1.+f,d);}
vec4 samp(vec2 s){if(s.x<0.||s.y<0.||s.x>S.x||s.y>S.y)return vec4(0.);return texture(T,s/S);}
vec4 lidc(vec4 c,vec2 s,vec4 E,vec3 LC,float tilt){

  vec2 q=(s-E.xy)/E.zw;float sn=sin(tilt),cs=cos(tilt);q=vec2(cs*q.x-sn*q.y,sn*q.x+cs*q.y);

  float above=1.-smoothstep(yl-.03,yl+.03,q.y);
  vec3 col=mix(LC,LC*.80,smoothstep(yl-.7,yl,q.y));
  float lash=(1.-smoothstep(0.,.10,abs(q.y-yl)))*smoothstep(.2,.55,lid)*inside*(1.-smoothstep(.85,1.,abs(q.x)));

vec4 mouth(vec4 c,vec2 s){

  for(int i=0;i<10;i++){if(i>=NB)break;float w=wt(s,BR[i],BP[i].z);
    if(BP[i].w<.5) s=rot(s,BP[i].xy,-BV[i].x*w); else s-=BV[i].yz*w;}

class Cat{
  constructor(img,rig={},opts={}){

    this.wrap=el('div','catwrap',opts.parent);this.cv=el('canvas',null,this.wrap);const res=opts.res||.7;
    this.cv.width=Math.round(this.cw*res);this.cv.height=Math.round(this.ch*res);
    css(this.cv,{width:this.cw+'px',height:this.ch+'px',left:this.lo[0]+'px',top:this.lo[1]+'px'});this.flip=!!opts.flip;
    const gl=this.gl=this.cv.getContext('webgl2',{premultipliedAlpha:true,alpha:true,preserveDrawingBuffer:true,antialias:false});

  }
  draw(pose={}){

    this.bones.forEach(bn=>{let v=pose[bn.n];if(bn.eye){const ex=bn.r[2],ey=bn.r[3];v=[g[0]*ex*.55,g[1]*ey*.45];}
      if(bn.t==='move'){v=v||[0,0];BV.push(0,v[0],v[1]);}else BV.push(v||0,0,0);});
    while(BV.length<30)BV.push(0,0,0);
    const key=BV.map(x=>x.toFixed(4)).join(',')+'|'+(pose.lid||0).toFixed(3)+'|'+(pose.mouth||0).toFixed(3);if(key===this.last)return;this.last=key;

  place(x,y,s,o={}){
    const bx=(o.base||[this.W/2,this.H])[0],by=(o.base||[this.W/2,this.H])[1];

    const op=o.op==null?1:o.op;this.wrap.style.opacity=op;this.wrap.style.display=op<=0?'none':'';
  }

const RIG={
  neutral:{pad:[.12,.06],bones:[
    {n:'head',t:'rot',r:[440,380,400,335],p:[440,700],f:.35},
    {n:'tail',t:'rot',r:[1010,1300,240,210],p:[770,1330],f:.7},

    {n:'earL',t:'rot',r:[200,170,120,150],p:[235,305],f:.45},

const IMG={};function loadImg(n){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='img/'+n+'.png';IMG[n]=i;});}
function blinkAt(t,times){let l=0;for(const b of times){const k=t-b;if(k>0&&k<.15)l=Math.max(l,k<.04?E.inQuad(k/.04):k<.075?1:1-E.outQuad((k-.075)/.075));}return l;}
function talk(t,a,b,seed=3){if(t<a||t>b)return 0;const e=P(t,a,a+.05)*(1-P(t,b-.06,b));return e*clamp(vnoise(seed,t*11)*1.3-.15)*.85;}
function breath(t,amp=.005,per=2.4){return 1+amp*Math.sin(t*2*Math.PI/per);}
let grain;function buildGrain(){grain=el('div','L');css(grain,{zIndex:900,pointerEvents:'none',mixBlendMode:'overlay',opacity:'.05'});const tiles=[];
  for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=mulberry32(101+k);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);tiles.push(c.toDataURL());}grain.tiles=tiles;}
function updGrain(t){const f=Math.floor(t*C.fps);grain.style.backgroundImage=`url(${grain.tiles[f%4]})`;const r=mulberry32(f*31+7);grain.style.backgroundPosition=`${Math.floor(r()*256)}px ${Math.floor(r()*256)}px`;}

// 1 · HOOK
// ======================================================================
const H={};
function buildHook(){
  const L=H.L=layer(10,'var(--off)');const cam=H.cam=el('div','L',L);
  H.shadow=el('div','shadow',cam);
  H.cat=new Cat(IMG.cat_neutral_f,RIG.neutral,{parent:cam,res:.62});
  H.micro=el('div','a lab',cam);css(H.micro,{left:'144px',top:'300px',color:'#77756F'});
  const mk=(top,fs)=>{const d=el('div','a',cam);css(d,{left:'140px',top:top+'px',fontSize:fs+'px',fontWeight:600,letterSpacing:'-.045em',lineHeight:'1',whiteSpace:'nowrap'});return d;};
  H.l1=words(mk(338,148),'Got something');
  const r2=mk(494,148);H.l2=words(r2,'worth');const sp=el('span',null,r2);css(sp,{marginLeft:'.26em',fontSize:'172px'});H.l2b=words(sp,'watching?','serif');

  B7.conf.place(1180,215,.76,{base:[342,1106],sx:pop,sy:(2-pop)*breath(t),op:sw});
}

function updEnd(t){
  const on=t>=C.S8-.02;show(N8.L,on);if(!on)return;
  const k=E.inOutQuart(P(t,C.S8,C.S8+.46));
  const x=lerp(0,CTA.x,k),y=lerp(0,CTA.y,k),w=lerp(1920,CTA.w,k),h=lerp(1080,CTA.h,k),r=lerp(0,64,k);

  css(N8.studio,{opacity:P(t,C.S8+.36,C.S8+.5),letterSpacing:`${lerp(.7,.42,E.outQuint(P(t,C.S8+.36,C.S8+.9)))}em`});
  revealUp(N8.t1,t,C.tagline,.07,.6);glide(N8.t2,t,C.tagline+.55,.08,.5,50);
  const cp=E.outQuint(P(t,C.cta,C.cta+.3));css(N8.ctaT,{opacity:P(t,C.cta,C.cta+.12),transform:`translateY(${(1-cp)*14}px)`,letterSpacing:`${lerp(.12,.01,cp)}em`});
  css(N8.pill,{transform:`scale(${1+.04*wiggle(t-C.cta,3,.5)})`});
  css(N8.small,{opacity:P(t,C.cta+.15,C.cta+.32),transform:`translateY(${(1-E.outQuint(P(t,C.cta+.15,C.cta+.5)))*12}px)`});
  const ci=spring(t-(C.S8+.12),1.5,.6);const wv=t-C.wave1;const env=P(t,C.wave1,C.wave1+.15)*(1-E.inOutSine(P(t,C.wave1+.95,C.wave1+1.3)));
  N8.cat.draw({paw:.16*Math.sin(wv*2*Math.PI*2.1)*env,head:.04*Math.sin(wv*2*Math.PI*1.05)*env,earR:.2*wiggle(t-(C.wave1+1.4),3,.35)});
  const s=.7,X=1220,Y=262+(1-ci)*240;N8.cat.place(X,Y,s,{base:[460,1106],sy:breath(t),op:P(t,C.S8+.12,C.S8+.22)});
  css(N8.shadow,{left:(X+460*s-260)+'px',top:(262+1100*s-30)+'px',width:'520px',height:'60px',opacity:P(t,C.S8+.2,C.S8+.5)});
}

async function init(){
  await Promise.all(['cat_neutral_f','cat_present_f','cat_calm_f','cat_confident_f','cat_wave_f','cat_impressed_f'].map(loadImg));
  for(const w of ['500','600','700','800'])await document.fonts.load(`${w} 40px InterD`);await document.fonts.load('italic 40px Serif');await document.fonts.ready;
  buildHook();buildMid();buildWhy();buildRange();buildPayoff();buildEnd();buildGrain();
  window.seek=async(t)=>{pending=[];updHook(t);updMid(t);updWhy(t);updRange(t);updPayoff(t);updEnd(t);updGrain(t);await Promise.all(pending);};
  const q=new URLSearchParams(location.search);
  if(q.has('t'))await window.seek(parseFloat(q.get('t')));
  else if(q.has('play')){const t0=performance.now();const loop=()=>{window.seek(((performance.now()-t0)/1000)%C.dur);requestAnimationFrame(loop);};loop();}
  else await window.seek(0);
  window.READY=true;
}
init().catch(e=>{window.INITERR=String(e&&e.stack||e);console.error(e);});

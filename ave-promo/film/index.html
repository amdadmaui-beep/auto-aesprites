const IMG={};function loadImg(n){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='img/'+n+'.png';IMG[n]=i;});}

async function init(){

  buildHook();buildMid();buildDash();buildWhy();buildRange();buildPayoff();buildEnd();buildGrain();
  window.seek=async(t)=>{pending=[];updHook(t);updMid(t);updDash(t);updWhy(t);updRange(t);updPayoff(t);updEnd(t);updGrain(t);await Promise.all(pending);};
  const q=new URLSearchParams(location.search);

}

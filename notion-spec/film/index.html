<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notion Agents spec spot</title>
<style>
@font-face{font-family:UI;src:url(fonts/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:UI;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:UI;src:url(fonts/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:SerifI;src:url(fonts/InstrumentSerif-italic-400.woff2)}
:root{--ink:#191919;--ink2:#37352f;--mute:#8a8984;--blue:#2383e2;--red:#e03e3e;--green:#0f9d58}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#eef0f7;font-family:UI,'Noto Color Emoji',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.scene{position:absolute;inset:0;transform-origin:50% 50%}
.emo{font-family:'Noto Color Emoji';line-height:1}
/* frosted glass rim around a white card, the reference's signature surface */
.glass{position:absolute;padding:12px;border-radius:38px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.18));border:1.5px solid rgba(255,255,255,.85);box-shadow:0 40px 90px rgba(35,30,110,.22),0 6px 18px rgba(35,30,110,.10),inset 0 1px 0 #fff}
.glass>.in{position:relative;width:100%;height:100%;background:#fff;border-radius:27px;overflow:hidden}
.pill{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;white-space:nowrap}
.gp{padding:9px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.2));border:1.5px solid rgba(255,255,255,.85);box-shadow:0 24px 60px rgba(35,30,110,.2)}
.tag{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:7px 16px;font-weight:600;font-size:26px}
.ph{position:relative;overflow:hidden;flex:none}
.ph img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
svg{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<script src="cues.js"></script>
<script>
const C=window.CUES, S=C.scene;
// ---------------------------------------------------------------- math
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u, P=(t,a,b)=>cl((t-a)/(b-a));
const oC=u=>1-Math.pow(1-u,3), oQ=u=>1-Math.pow(1-u,5), ioC=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, ioQ=u=>u<.5?16*u**5:1-Math.pow(-2*u+2,5)/2;
const oB=(u,s=1.7)=>{u=cl(u);const c=s+1;return 1+c*Math.pow(u-1,3)+s*Math.pow(u-1,2)};
const spr=(u,z=.5,w=13)=>{u=Math.max(0,u);return u>=1.8?1:1-Math.exp(-z*w*u)*Math.cos(w*Math.sqrt(1-z*z)*u)};
const win=(t,a,b,fi=.25,fo=.25)=>Math.min(P(t,a,a+fi),1-P(t,b-fo,b));
// ---------------------------------------------------------------- dom
const stage=document.getElementById('stage');
function el(par,cls,html,css){const e=document.createElement('div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)e.style.cssText=css;par.appendChild(e);return e}
function vis(e,o){e.style.opacity=o;e.style.visibility=o<=.001?'hidden':'visible'}
const BG={maya:'#f7d9cc',zoe:'#d5e3fb',ava:'#d9efdf',ben:'#ece3f7',kai:'#fbe9bd',lea:'#f8d6e2',g1:'#dfe7fb',g2:'#f8dccb',g3:'#e3f1e6',g4:'#efe4f8',notes:'#dbe6fb',hero:'#f5d7c6',risk:'#e8e1f7',cal:'#fbe9bd'};
const ph=(k,w,h,r='50%',bg)=>`<div class="ph" style="width:${w}px;height:${h}px;border-radius:${r};background:${bg||BG[k]}"><img src="img/${k}.png"></div>`;
// ---------------------------------------------------------------- icons
const I=(d,c='#191919',s=26,w=2.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',spark:'<path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  vid:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',phone:'<path d="M3 13c5-5 13-5 18 0l-2.5 3-3.5-1.5v-2.5c-2-.7-4-.7-6 0v2.5L5.5 16z"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'};
const CURSOR=s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.6-4.3 2.9 6.6 3.2-1.4-2.9-6.5h6.3z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
const MARK=s=>`<img src="brand/notion-mark.svg" width="${s}" height="${s}" style="display:block">`;
const SPIN=(s,c='#191919')=>`<svg class="spin" width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="3"/><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;

// ================================================================ backgrounds
const bgA=el(stage,'scene','','background:radial-gradient(ellipse at 30% 20%,#ffffff 0%,#eef0f8 45%,#e3e6f4 100%)');
const bgMesh=el(stage,'scene','','background:#8f93f3;overflow:hidden');
const blobs=[['#5d63ee',1100,-300,-350],['#f3a9d6',900,1150,520],['#c9d3ff',900,900,-380],['#6f8ff7',800,-250,520],['#ffffff',620,560,200],['#f7c4e2',600,250,760],['#7b70ea',700,1450,-150]]
  .map(([c,s,x,y])=>({e:el(bgMesh,'blob','',`background:${c};width:${s}px;height:${s}px;left:${x}px;top:${y}px;opacity:.9`)}));
const bgStreak=el(stage,'scene','','background:#8f93f3;overflow:hidden');
const streaks=Array.from({length:16},(_,i)=>el(bgStreak,'abs','',`left:-600px;width:3120px;height:${50+((i*41)%110)}px;top:${i*70-50}px;filter:blur(${10+(i%3)*8}px);background:linear-gradient(90deg,transparent,${['#5d63ee','#f3a9d6','#ffffff','#c9d3ff','#7b70ea','#f7c4e2'][i%6]} 25%,${['#ffffff','#8f93f3','#f3a9d6','#5d63ee'][i%4]} 70%,transparent)`));
const bgDark=el(stage,'scene','','background:radial-gradient(ellipse at 50% 48%,#2d2a48 0%,#16151f 55%,#0b0b10 100%)');
const bgEnd=el(stage,'scene','','background-color:#fbfbfa;background-image:radial-gradient(rgba(55,53,47,.16) 1.5px,transparent 1.7px);background-size:38px 38px');

// ================================================================ A: meeting chaos (3D tilted cards)
const A=el(stage,'scene','','perspective:1600px');
const Aw=el(A,'abs','','inset:0;transform-style:preserve-3d;transform-origin:50% 50%');
const aCards=[];
function aCard(x,y,w,h,ry,rx,z,html,inbg){const c=el(Aw,'glass',`<div class="in" style="${inbg?'background:'+inbg:''}">${html}</div>`,`left:${x}px;top:${y}px;width:${w}px;height:${h}px`);aCards.push({e:c,ry,rx,z});return c}
const clockC=aCard(170,250,460,560,28,4,-60,`<div style="padding:38px 40px;font-weight:600;font-size:28px;color:var(--mute);display:flex;gap:12px;align-items:center">${I(IC.cal,'#8a8984',30)}Daily stand-up</div><div class="clock" style="position:absolute;top:190px;width:100%;text-align:center;font-size:150px;font-weight:600;letter-spacing:-5px">10:13</div><div style="position:absolute;bottom:52px;left:40px;right:40px;height:12px;border-radius:9px;background:#efefee"><div class="bar" style="height:100%;border-radius:9px;background:var(--red);width:30%"></div></div>`);
const gridC=aCard(700,215,560,600,-4,2,40,`<div class="pill" style="position:absolute;left:30px;top:28px;padding:12px 22px;font-weight:600;font-size:24px;background:#f3f3f1"><span class="rec" style="width:13px;height:13px;border-radius:50%;background:var(--red)"></span>Status meeting · <span class="mins">47</span> min</div>
  <div style="position:absolute;left:24px;top:100px;display:grid;grid-template-columns:1fr 1fr;gap:14px">${['g1','g2','g3','g4'].map((k,i)=>`<div style="position:relative">${ph(k,242,224,'18px')}<div class="spk" style="position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 4px #2ecc71;opacity:0"></div></div>`).join('')}</div>
  <div style="position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px">${[IC.mic,IC.vid].map(d=>`<span style="width:54px;height:54px;border-radius:50%;background:#f3f3f1;display:flex;align-items:center;justify-content:center">${I(d,'#37352f',26)}</span>`).join('')}<span style="width:54px;height:54px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center">${I(IC.phone,'#fff',28)}</span></div>`);
const joinC=aCard(790,-40,330,190,-12,-8,-120,`<div style="padding:28px 32px;font-size:24px;font-weight:600;color:var(--mute)">Status sync · 11:00</div><div class="join" style="position:absolute;left:32px;right:32px;bottom:28px;height:58px;border-radius:14px;background:#5b5bd6;color:#fff;font-weight:600;font-size:26px;display:flex;align-items:center;justify-content:center">Join</div>`);
const syncC=aCard(1330,300,380,440,-30,3,-40,`<div style="padding:34px;font-weight:600;font-size:26px;color:#a15c3c">Team sync starts in</div><div class="cd" style="position:absolute;top:150px;width:100%;text-align:center;font-size:140px;font-weight:600;letter-spacing:-5px;color:#2b1a12">1:00</div>`,'#fde3d6');
const calC=aCard(470,850,640,118,10,-6,60,`<div style="display:flex;align-items:center;gap:18px;padding:0 20px 0 30px;height:100%;font-size:30px;font-weight:600;white-space:nowrap">${I(IC.vid,'#2383e2',34)}<span>Weekly check-in</span><span style="color:var(--mute);font-weight:500">2:30 PM</span><div style="margin-left:auto;display:flex">${['kai','maya','zoe'].map((k,i)=>`<div style="margin-left:-14px;border:3px solid #fff;border-radius:50%">${ph(k,62,62)}</div>`).join('')}</div></div>`);
const faceC=aCard(1520,10,300,320,-26,-6,-80,ph('cal',276,296,'26px'),'#fbe9bd');
const aCurBig=el(A,'abs',CURSOR(420),'left:0;top:0;transform-origin:0 0;filter:blur(5px)');
const aCur=el(A,'abs',CURSOR(72),'left:0;top:0;transform-origin:0 0');

// ================================================================ B: chat bubbles + "Nobody doing."
const B=el(stage,'scene');
const bWrap=el(B,'abs','','left:470px;top:150px;width:980px;height:800px');
const bub=[['maya','Maya','9:02 AM','Almost there.'],['zoe','Zoe','9:03 AM','No blockers. Still in progress.'],['ava','Ava','9:04 AM','Same as last week.'],['ben','Ben','9:05 AM','Waiting on review.']].map(([k,n,t,m],i)=>
  el(bWrap,'glass',`<div class="in" style="display:flex;gap:24px;align-items:center;padding:0 34px">${ph(k,84,84)}<div><div style="font-size:28px;font-weight:600">${n}<span style="color:var(--mute);font-size:24px;margin-left:14px;font-weight:500">${t}</span></div><div style="font-size:40px;font-weight:500;color:var(--ink2);letter-spacing:-.5px">${m}</div></div></div>`,`left:0;top:${i*158}px;width:980px;height:148px;border-radius:34px`));
bub.forEach(b=>b.firstChild.style.borderRadius='23px');
const typing=el(bWrap,'pill gp',`<div class="pill" style="position:relative;padding:8px 26px 8px 8px">${ph('kai',58,58)}${[0,1,2].map(()=>'<span class="d" style="width:12px;height:12px;border-radius:50%;background:#b8b7c9"></span>').join('')}</div>`,'left:385px;top:660px');
const tint=el(B,'abs','','inset:-100px;background:radial-gradient(ellipse at 50% 50%,rgba(40,30,120,.42),rgba(40,30,120,.12));opacity:0');
const nobody=el(B,'abs','<span>Nobody</span> <span>doing.</span>','left:0;right:0;top:445px;text-align:center;font-size:190px;font-weight:700;letter-spacing:-8px;color:#fff;text-shadow:0 10px 60px rgba(40,30,120,.35)');
// ================================================================ C: Notion AI prompt
const Cs=el(stage,'scene');
const box=el(Cs,'glass',`<div class="in">
  <div style="position:absolute;left:60px;top:48px;display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:var(--ink2)">${MARK(44)}Notion AI</div>
  <div class="txt" style="position:absolute;left:60px;top:130px;font-size:84px;font-weight:500;letter-spacing:-2.5px;white-space:nowrap;color:#191919"></div>
  <div style="position:absolute;left:60px;bottom:50px;display:flex;gap:16px">${[['spark','Ask','#2383e2','#e7f1fb'],['search','Research','#7c4dbe','#f1ebfa'],['pen','Draft','#d9730d','#fbefe4'],['bolt','Agents','#0f9d58','#e5f4ec']].map(([i,l,c,b])=>`<span class="tag chip" style="color:${c};background:${b}">${I(IC[i],c,24)}${l}</span>`).join('')}</div>
  <div class="send" style="position:absolute;right:50px;bottom:42px;width:72px;height:72px;border-radius:50%;background:#191919;display:flex;align-items:center;justify-content:center">${I(IC.up,'#fff',34,2.8)}</div></div>`,'left:250px;top:300px;width:1420px;height:400px');
const assign=el(Cs,'pill gp',`<div class="pill" style="position:relative;padding:18px 34px">${SPIN(34)}<span style="font-size:32px;font-weight:600">Assigning agents…</span></div>`,'left:720px;top:760px');
const cCur=el(Cs,'abs',CURSOR(72),'left:0;top:0;transform-origin:0 0');
// ================================================================ D: agent cards (people on pastel, like the reference)
const D=el(stage,'scene');
const agents=[['notes','Meeting Notes','Summarizes every meeting','8 action items captured','linear-gradient(160deg,#dbe6fb,#c6d4fa)'],['hero','Project Tracker','Reports progress automatically','3 off-track tasks caught','linear-gradient(160deg,#f9e0d2,#f3c6b4)'],['risk','Risk Radar','Flags what could slip','12 docs reviewed','linear-gradient(160deg,#ebe4f8,#d8cdf4)']].map(([k,n,s,b,g],i)=>
  el(D,'glass',`<div class="in"><div class="art" style="position:absolute;left:16px;top:16px;right:16px;height:440px;border-radius:20px;overflow:hidden;background:${g}"><img src="img/${k}.png" style="position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%)"></div>
  <div class="pill" style="left:34px;top:392px;padding:9px 20px 9px 9px;font-size:23px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.14)">${ph(k,40,40)}${b}</div>
  <div style="position:absolute;left:34px;top:482px;font-size:40px;font-weight:700;letter-spacing:-1px">${n}</div><div style="position:absolute;left:34px;top:534px;font-size:25px;color:var(--mute);font-weight:500">${s}</div></div>`,`left:${960-240}px;top:${540-300}px;width:480px;height:600px`));
const dCur=el(D,'abs',CURSOR(72),'left:0;top:0;transform-origin:0 0');
// ================================================================ E: avatar + chips
const E=el(stage,'scene');
const eAv=el(E,'abs',`<div style="padding:12px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.2));border:1.5px solid rgba(255,255,255,.85);box-shadow:0 30px 80px rgba(35,30,110,.25)">${ph('hero',300,300,'50%','linear-gradient(160deg,#f9e0d2,#f3c6b4)')}</div>`,'left:0;top:0;transform-origin:50% 50%');
const chipDefs=[['doc','Read','#2383e2','#e7f1fb','every doc'],['flag','Flag','#e03e3e','#fdeaea','what’s stuck'],['arrow','Push','#0f9d58','#e5f4ec','it forward']];
const chips=chipDefs.map(([i,l,c,b,txt],k)=>el(E,'pill gp',`<div class="pill" style="position:relative;padding:12px 26px 12px 12px"><span class="tag" style="color:${c};background:${b};font-size:34px;padding:10px 20px">${I(IC[i],c,32)}${l}</span><span style="font-size:44px;font-weight:500;letter-spacing:-1px">${txt}</span>${k==1?'<span class="tag stuck" style="background:#e03e3e;color:#fff;font-size:28px;padding:8px 16px">Stuck</span>':''}</div>`,'left:0;top:0;transform-origin:0 50%'));
// ================================================================ F1: "3 risks flagged" on streaks
const F1=el(stage,'scene');
const rLine=el(F1,'abs',`<span class="n" style="font-size:150px;font-weight:700;color:#fff">3</span>${['🚩','⏳','💸'].map(e=>`<span class="ti" style="display:inline-flex;width:150px;height:150px;border-radius:36px;background:#fff;box-shadow:0 20px 50px rgba(35,30,110,.25);align-items:center;justify-content:center"><span class="emo" style="font-size:84px">${e}</span></span>`).join('')}<span class="w" style="font-size:150px;font-weight:700;letter-spacing:-6px;color:#fff">risks flagged</span>`,'left:0;right:0;top:450px;display:flex;justify-content:center;align-items:center;gap:30px;text-shadow:0 10px 50px rgba(40,30,120,.3)');
// ================================================================ F2: Notion pages
const F2=el(stage,'scene');
const pageDefs=[['Q4 Roadmap','roadmap','🗺️'],['Hiring Plan','hiring','👋'],['Launch Plan','launch','🚀'],['Budget Review','budget','💰'],['Team Retro','retro','🔁']];
const pages=pageDefs.map(([n,cov,emo],i)=>{const big=i==2;const w=big?700:500,h=big?760:560,cv=big?230:180;
  return el(F2,'glass',`<div class="in"><img src="img/covers/${cov}.jpg" style="position:absolute;left:0;top:0;width:100%;height:${cv}px;object-fit:cover">
  <span class="emo" style="position:absolute;left:44px;top:${cv-50}px;font-size:${big?96:76}px">${emo}</span>
  <div style="position:absolute;left:44px;top:${cv+(big?70:50)}px;font-size:${big?58:42}px;font-weight:700;letter-spacing:-1.5px">${n}</div>
  ${big?`<div style="position:absolute;left:44px;top:${cv+160}px;display:grid;grid-template-columns:170px 1fr;row-gap:16px;font-size:26px;font-weight:500;align-items:center"><span style="color:var(--mute)">Owner</span><span style="display:flex;gap:12px;align-items:center">${ph('hero',38,38)}Project Tracker</span><span style="color:var(--mute)">Status</span><span><span class="tag status" style="font-size:24px;padding:5px 14px;background:#e5f4ec;color:#0f9d58">${I(IC.check,'#0f9d58',22,3)}Drafted</span></span></div>
  <div style="position:absolute;left:44px;top:${cv+290}px;right:44px;border-top:1.5px solid #efefed;padding-top:14px">${['Lock launch date','Brief design + eng','Write announcement','Prep support docs'].map(t=>`<div class="row" style="display:flex;gap:18px;align-items:center;height:58px;font-size:30px;font-weight:500"><span class="bx" style="width:32px;height:32px;border-radius:7px;border:2.5px solid #c9c8c4;display:flex;align-items:center;justify-content:center"></span><span class="tx">${t}</span></div>`).join('')}</div>`
  :`<div style="position:absolute;left:44px;right:44px;top:${cv+130}px">${[82,64,74,52,68].map(w=>`<div style="height:16px;border-radius:8px;background:#efeeec;margin-bottom:22px;width:${w}%"></div>`).join('')}</div>`}</div>`,
  `left:${960-w/2}px;top:${540-h/2}px;width:${w}px;height:${h}px`)});
// ================================================================ G: orbit (dark)
const G=el(stage,'scene');
const orbit=el(G,'abs','',`left:${960-1400}px;top:${540-1400}px;width:2800px;height:2800px`);

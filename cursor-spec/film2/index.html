<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor — From Idea to Reality V2 (AVE Studio spec)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<script src="cues.js"></script>
<script src="lib.js"></script>
<script src="shots.js"></script>
<script>
async function init(){
  for(const f of['500 40px UI','600 40px UI','400 20px Mono','500 20px Mono'])await document.fonts.load(f);await document.fonts.ready;
  await Promise.all(['brand/CUBE_25D.png','brand/WORDMARK_DARK.svg'].map(src=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src=src;})));
  buildWorld();buildDash();buildKey();buildShots();buildGrain();
  window.seek=async(t)=>{render(t);updGrain(t);};
  const q=new URLSearchParams(location.search);await window.seek(q.has('t')?parseFloat(q.get('t')):0);
  window.READY=true;
}
init().catch(e=>{window.INITERR=String(e&&e.stack||e);console.error(e);});
</script>
</body>
</html>

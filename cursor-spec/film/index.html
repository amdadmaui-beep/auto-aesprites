<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor — From Idea to Reality (AVE Studio spec)</title>
<style>
@font-face{font-family:UI;src:url(fonts/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:UI;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-normal-400.woff2);font-weight:400}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-normal-500.woff2);font-weight:500}
:root{
  --bg:#0E0D09; --brand-ink:#14120B; --paper:#F7F7F4; --mute:#8A877D; --faint:#5B594F;
  --win:#17160F; --panel:#1B1A13; --line:#2B2A22; --line2:#35342B;
  --kw:#C7A6F0; --fn:#8EC5F2; --str:#E8C08E; --ty:#8DD6B5; --num:#F0A98E; --pun:#A8A598; --id:#E7E5DD;
  --add:rgba(120,200,150,.13); --addbar:#79C796; --del:#E58C7C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:UI,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px}
.a{position:absolute}
.mono{font-family:Mono,monospace}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.wi{display:inline-block;will-change:transform}
/* editor window */
#win{position:absolute;left:0;top:0;width:1700px;height:940px;transform-style:preserve-3d}
.pane{position:absolute;overflow:hidden}
.frame{position:absolute;inset:0;border-radius:16px;background:linear-gradient(180deg,#1C1B14,#141309);
  box-shadow:0 0 0 1px rgba(247,247,244,.10),inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #2E2D25,0 80px 160px -50px rgba(0,0,0,.9),0 60px 120px -40px rgba(0,0,0,.85),0 30px 60px -30px rgba(0,0,0,.7)}
.tb{position:absolute;left:0;right:0;top:0;height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mute)}
.dots{position:absolute;left:18px;top:14px;display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#2F2E26}
.side{left:0;top:40px;width:312px;height:900px;border-right:1px solid var(--line);background:var(--panel)}
.act{position:absolute;left:0;top:0;width:52px;height:100%;border-right:1px solid var(--line);display:grid;align-content:start;justify-items:center;gap:22px;padding-top:18px}
.act i{width:20px;height:20px;border-radius:5px;border:1.6px solid #4A4940}
.act i.on{border-color:#CFCCC2}
.tree{position:absolute;left:52px;top:0;right:0;padding:14px 0;font-size:15px;color:#BDBAB0}
.tree .h{font-size:11px;letter-spacing:.16em;color:var(--faint);padding:0 18px 10px;font-family:Mono}
.tree .r{height:30px;display:flex;align-items:center;gap:8px;padding-left:18px;white-space:nowrap}
.tree .r.d1{padding-left:38px}.tree .r.on{background:rgba(247,247,244,.07);color:var(--paper)}
.tree .ic{width:12px;height:12px;border-radius:3px;background:#3A392F}.tree .ic.ts{background:#3B5E86}.tree .ic.tx{background:#3E7C6C}
.ed{left:312px;top:40px;width:900px;height:900px}
.tabs{position:absolute;left:0;right:0;top:0;height:42px;border-bottom:1px solid var(--line);display:flex;font-size:14px;color:var(--mute);background:var(--panel)}
.tabs .t{height:42px;display:flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid var(--line);white-space:nowrap}
.tabs .t.on{background:var(--win);color:var(--paper);box-shadow:inset 0 2px 0 #CFCCC2}
.code{position:absolute;left:0;right:0;top:42px;bottom:0;font-family:Mono;font-size:20px;line-height:32px;padding-top:16px}
.ln{position:relative;height:32px;white-space:pre}
.ln .no{position:absolute;left:0;width:52px;text-align:right;color:#4C4B42;font-size:16px}
.ln .tx{position:absolute;left:72px;right:0}
.ln .gh{position:absolute;left:72px;color:#6C6A60;font-style:italic}
.ln .bg{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--add);transform-origin:0 50%}
.ln .bar{position:absolute;left:58px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--addbar)}
.k{color:var(--kw)}.f{color:var(--fn)}.s{color:var(--str)}.y{color:var(--ty)}.n{color:var(--num)}.p{color:var(--pun)}.i{color:var(--id)}.g{color:#6C6A60}
.caret{position:absolute;width:2.5px;height:26px;background:var(--paper);border-radius:1px}
.term{position:absolute;left:0;right:0;bottom:0;background:#141309;border-top:1px solid var(--line);overflow:hidden;font-family:Mono;font-size:17px;line-height:30px;color:#CFCCC2}
.term .hd{height:40px;display:flex;align-items:center;gap:22px;padding:0 20px;font-size:12px;letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--line)}
.agent{left:1212px;top:40px;width:488px;height:900px;border-left:1px solid var(--line);background:var(--panel)}
.agent .hd{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;font-size:14px;color:var(--paper);gap:10px}
.agent .hd b{font-weight:500}
.bubble{position:absolute;left:20px;right:20px;border-radius:12px;background:#24231B;border:1px solid var(--line2);padding:14px 16px;font-size:17px;line-height:1.45;color:var(--paper)}
.msg{position:absolute;left:20px;right:20px;font-size:16.5px;line-height:1.5;color:#CFCCC2}
.step{position:absolute;left:20px;right:20px;height:40px;border-radius:9px;display:flex;align-items:center;gap:12px;padding:0 12px;font-family:Mono;font-size:14.5px;color:#D8D5CB;background:rgba(247,247,244,.035);border:1px solid var(--line)}
.step .dot{width:16px;height:16px;border-radius:50%;border:2px solid #5B594F;flex:none;position:relative}
.step .dot.ok{border-color:var(--addbar);background:var(--addbar)}
.step .dif{margin-left:auto;display:flex;gap:8px}.step .pl{color:var(--addbar)}.step .mi{color:var(--del)}
.input{position:absolute;left:20px;right:20px;bottom:20px;height:118px;border-radius:14px;border:1px solid var(--line2);background:#201F17;padding:14px 16px;font-size:17px;line-height:1.45}
.input .ph{color:var(--faint)}
.send{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.preview{position:absolute;left:312px;top:40px;width:900px;height:900px;background:var(--win);overflow:hidden;border-right:1px solid var(--line)}
.url{height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);font-family:Mono;font-size:14px;color:#BDBAB0}
.url span{flex:1;height:30px;border-radius:8px;background:#22211A;display:flex;align-items:center;padding:0 12px}
/* supers */
.sup{position:absolute;left:120px;font-weight:600;font-size:60px;letter-spacing:-.02em;line-height:1.02;white-space:nowrap}
.sup .l2{color:var(--mute)}
/* dashboard (light) */
#dash{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#F2F1EC;color:#14120B;transform-origin:0 0;transform-style:preserve-3d}
#dash .card{position:absolute;background:#FFFFFF;border-radius:20px;box-shadow:0 1px 0 rgba(20,18,11,.04),0 18px 40px -24px rgba(20,18,11,.25);border:1px solid #E6E4DC}
#dash .lab{font-size:19px;color:#77746B;font-weight:500}
#dash .val{font-size:56px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
#dash .chip{display:inline-block;font-size:15px;font-weight:600;border-radius:999px;padding:4px 10px}
/* keycap */
#key{position:absolute;width:168px;height:118px;transform-style:preserve-3d}
#key .base{position:absolute;inset:10px 0 0 0;border-radius:20px;background:#0B0A07}
#key .cap{position:absolute;left:0;right:0;top:0;height:108px;border-radius:20px;
  background:linear-gradient(180deg,#3A392F 0%,#2A291F 55%,#22211A 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 -6px 10px rgba(0,0,0,.35),0 2px 0 #11100B;
  display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px;font-size:22px;color:#D8D5CB;font-weight:500}
</style>
</head>
<body>
<div id="stage"></div>
<script src="cues.js"></script>
<script>
'use strict';
const C=window.CUES, stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t, P=(t,a,b)=>clamp((t-a)/(b-a));
const E={outCubic:x=>1-Math.pow(1-x,3),outQuart:x=>1-Math.pow(1-x,4),outQuint:x=>1-Math.pow(1-x,5),outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inCubic:x=>x*x*x,inQuad:x=>x*x,inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,inOutQuart:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,outBack:(x,s=1.4)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
function bump(t,a,up=.06,hold=0,down=.14){if(t<a)return 0;const k=t-a;if(k<up)return 1-Math.pow(1-k/up,2);if(k<up+hold)return 1;return 1-E.inOutSine(clamp((k-up-hold)/down));}
function mulberry32(a){return function(){a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}
function css(e,o){for(const k in o)e.style[k]=o[k];return e;}
function show(e,on){e.style.display=on?'':'none';}
const typed=(arr,t)=>{let n=0;for(const x of arr)if(t>=x)n++;return n;};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---------------- syntax highlighting (TS/TSX) ----------------
const KW=new Set(['import','from','export','function','const','return','type','default','new','use']);
function toks(s){const out=[];const re=/("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|(<\/?[A-Za-z][\w.]*)|([A-Za-z_$][\w$]*)|(\s+)|([^\sA-Za-z0-9_$"`])/g;let m;
  while((m=re.exec(s))){let c='p';const w=m[0];
    if(m[1])c='s';else if(m[2])c='n';else if(m[3])c='f';
    else if(m[4]){const nx=s.slice(re.lastIndex).match(/^\s*\(/);c=KW.has(w)?'k':/^[A-Z]/.test(w)?'y':nx?'f':'i';}
    else if(m[5])c='';out.push([w,c]);}
  return out;}
function hl(s,n=Infinity){let h='',k=0;for(const[w,c]of toks(s)){if(k>=n)break;const part=w.slice(0,n-k);k+=part.length;h+=c?`<span class="${c}">${esc(part)}</span>`:esc(part);}return h;}

// ---------------- stage: light, depth, grain ----------------
const BG={};
function buildBG(){
  BG.L=el('div','L');
  BG.spot=el('div','L',BG.L);css(BG.spot,{background:'radial-gradient(60% 55% at 50% 32%,rgba(247,238,214,.10),rgba(247,238,214,.03) 45%,transparent 72%)'});
  BG.grid=el('div','L',BG.L);css(BG.grid,{backgroundImage:'radial-gradient(rgba(247,247,244,.10) 1px,transparent 1.4px)',backgroundSize:'36px 36px',
    WebkitMaskImage:'radial-gradient(55% 60% at 50% 45%,#000,transparent 75%)'});
  BG.floor=el('div','a',BG.L);css(BG.floor,{left:'260px',width:'1400px',top:'860px',height:'160px',borderRadius:'50%',background:'radial-gradient(closest-side,rgba(0,0,0,.65),transparent)'});
}
function updBG(t,on){show(BG.L,on);if(!on)return;
  const s2=P(t,C.open,C.cube+.6);BG.L.style.opacity=s2;
  css(BG.grid,{backgroundPosition:`${(t*6)%36}px ${(t*3)%36}px`});
  css(BG.spot,{transform:`translateX(${Math.sin(t*.25)*60}px)`});
}

// ---------------- 1 · hook ----------------
const H={};
function buildHook(){
  H.L=el('div','L');css(H.L,{background:'#000',zIndex:30});
  const blk=H.blk=el('div','a',H.L);css(blk,{left:0,top:0,fontSize:'78px',fontWeight:600,letterSpacing:'-.01em',lineHeight:'96px',whiteSpace:'pre'});
  H.r1=el('div',null,blk);H.r2=el('div',null,blk);H.r2.style.color='#C9C6BC';
  H.c=el('div','a',H.L);css(H.c,{width:'5px',height:'74px',background:'var(--paper)',borderRadius:'2px'});
  H.e1=el('div','a',H.L);H.e2=el('div','a',H.L);
  for(const e of[H.e1,H.e2])css(e,{top:0,width:'2px',height:'1080px',background:'var(--paper)',boxShadow:'0 0 18px rgba(247,247,244,.5)'});
  // measure final width to centre the block
  H.r1.textContent='WHAT IF YOUR IDEAS';H.w=blk.offsetWidth;H.r1.textContent='';
}
function updHook(t){
  const on=t<C.open+.5;show(H.L,on);if(!on)return;
  const n1=typed(C.H1,t),n2=typed(C.H2,t);
  H.r1.textContent='WHAT IF YOUR IDEAS'.slice(0,n1);H.r2.textContent='MOVED FASTER?'.slice(0,n2);
  const bx=960-H.w/2,by=540-96;css(H.blk,{left:bx+'px',top:by+'px'});
  // caret follows the last typed character
  const line=n2>0||t>=C.l2-.1?H.r2:H.r1;const r=document.createRange();let x=bx,y=by+11;
  if(line.textContent.length){r.selectNodeContents(line);const b=r.getBoundingClientRect(),s=stage.getBoundingClientRect();x=b.right-s.left+6;}
  else if(line===H.r2)x=bx;else x=t<C.l1?960-2:bx;
  if(line===H.r2)y=by+96+11;
  const dv=E.inOutQuart(P(t,C.dive,C.open));
  const blink=t<C.l1||(t>C.l1End+.05&&t<C.l2-.05)||(t>C.l2End&&t<C.dive)?(Math.floor((t-.35)*2.6)%2?0:1):1;
  css(H.c,{left:lerp(x,958,dv)+'px',top:lerp(y,0,dv)+'px',height:lerp(74,1080,dv)+'px',opacity:t<C.caretOn?0:(dv>0?1:blink),boxShadow:dv>0?`0 0 ${30*dv}px rgba(247,247,244,.6)`:'none'});
  // text lifts away as the caret becomes the doorway
  const lift=E.inCubic(P(t,C.dive,C.dive+.2));css(H.blk,{opacity:1-lift,filter:`blur(${lift*12}px)`,transform:`translateY(${-lift*40}px) scale(${1+lift*.06})`});
  // the slit opens: two edges part and the next scene shows through
  const op=E.inOutCubic(P(t,C.open,C.open+.45));
  const half=op*960;show(H.e1,t>=C.open&&op<1);show(H.e2,t>=C.open&&op<1);show(H.c,t<C.open+.02);
  css(H.e1,{left:(959-half)+'px',opacity:1-op*.6});css(H.e2,{left:(959+half)+'px',opacity:1-op*.6});
  H.L.style.clipPath=t>=C.open?`polygon(0 0,${960-half}px 0,${960-half}px 1080px,${960+half}px 1080px,${960+half}px 0,1920px 0,1920px 1080px,0 1080px)`:'none';
}

// ---------------- the editor world + camera ----------------
const W={};
const FILES={
  hook:{name:'useMetrics.ts',ic:'ts',lines:['import { useEffect, useState } from "react"','import type { Metric } from "@/lib/types"','',
    'export function useMetrics(range: "7d" | "30d") {','  const [data, setData] = useState<Metric[]>([])','  useEffect(() => {','    fetch(`/api/metrics?range=${range}`)',
    '      .then((r) => r.json())','      .then(setData)','  }, [range])','  return data','}','',
    'export const compact = (n: number) =>','  new Intl.NumberFormat("en", { notation: "compact" }).format(n)']},
  card:{name:'MetricCard.tsx',ic:'tx',lines:['type Props = { label: string; value: string; delta: number }','',
    'export function MetricCard({ label, value, delta }: Props) {','  return (','    <div className="card">','      <p className="label">{label}</p>',
    '      <h3 className="value">{value}</h3>','      <span className="delta">','        {delta > 0 ? "+" : ""}{delta}%','      </span>','    </div>','  )','}']},
  rev:{name:'RevenueChart.tsx',ic:'tx',lines:['"use client"','import { Area, AreaChart, ResponsiveContainer } from "recharts"','import { useMetrics } from "@/hooks/useMetrics"','',
    'export function RevenueChart() {','  const data = useMetrics("30d")','  return (','    <ResponsiveContainer height={420}>','      <AreaChart data={data}>',
    '        <Area dataKey="revenue" strokeWidth={2.5} />','      </AreaChart>','    </ResponsiveContainer>','  )','}']},
  sig:{name:'SignupsChart.tsx',ic:'tx',lines:['"use client"','import { Bar, BarChart, ResponsiveContainer } from "recharts"','',
    'const channels = ["Organic", "Social", "Referral", "Ads", "Email"]','','export function SignupsChart({ data }: { data: number[] }) {','  const rows = data.map((v, i) => ({ channel: channels[i], v }))',
    '  return (','    <ResponsiveContainer height={420}>','      <BarChart data={rows}>','        <Bar dataKey="v" radius={8} />','      </BarChart>','    </ResponsiveContainer>','  )','}']},
  page:{name:'page.tsx',ic:'tx',lines:['import { compact } from "@/hooks/useMetrics"','import { MetricCard } from "@/components/MetricCard"','import { RevenueChart } from "@/components/RevenueChart"',
    'import { SignupsChart } from "@/components/SignupsChart"','','export default function Dashboard() {','  return (','    <main className="dashboard">',
    '      <MetricCard label="MRR" value={"$" + compact(48200)} delta={12.4} />','      <MetricCard label="Active users" value={compact(12904)} delta={8.1} />',
    '      <MetricCard label="Conversion" value="3.8%" delta={0.6} />','      <MetricCard label="Churn" value="1.2%" delta={-0.3} />',
    '      <RevenueChart />','      <SignupsChart data={[320, 210, 180, 260, 140]} />','    </main>','  )','}']},
};
const TREE=[['app/',0,''],['dashboard/',1,''],['page.tsx',2,'page','tx'],['layout.tsx',1,'','tx'],['components/',0,''],['MetricCard.tsx',1,'card','tx'],['RevenueChart.tsx',1,'rev','tx'],['SignupsChart.tsx',1,'sig','tx'],
  ['hooks/',0,''],['useMetrics.ts',1,'hook','ts'],['lib/',0,''],['types.ts',1,'','ts'],['package.json',0,''],['tsconfig.json',0,'']];
function buildWorld(){
  const L=W.L=el('div','L');css(L,{perspective:'2600px',perspectiveOrigin:'50% 45%'});
  const w=W.win=el('div',null,L);w.id='win';
  W.frame=el('div','frame',w);
  W.tb=el('div','tb',w,'acme-analytics');el('div','dots',W.tb,'<i></i><i></i><i></i>');
  W.icon=el('img','a',W.tb);W.icon.src='brand/CUBE_25D.png';css(W.icon,{left:'calc(50% - 92px)',top:'10px',width:'17px'});
  // sidebar
  W.side=el('div','pane side',w);const act=el('div','act',W.side,'<i class="on"></i><i></i><i></i><i></i>');
  const tr=el('div','tree',W.side);el('div','h',tr,'EXPLORER');
  W.rows={};for(const[nm,d,key,ic]of TREE){const r=el('div','r'+(d?' d'+Math.min(d,1):''),tr);if(d===2)r.style.paddingLeft='58px';
    el('i','ic'+(ic?' '+ic:''),r);el('span',null,r,nm);if(key)W.rows[key]=r;}
  // editor
  W.ed=el('div','pane ed',w);W.tabs=el('div','tabs',W.ed);W.tabEls={};
  W.codeBox=el('div','code',W.ed);W.lines=[];for(let i=0;i<26;i++){const d=el('div','ln',W.codeBox);const o={d,bg:el('div','bg',d),bar:el('div','bar',d),no:el('div','no',d,String(i+1)),tx:el('div','tx',d),gh:el('div','gh',d),k:''};W.lines.push(o);}
  W.caret=el('div','caret',W.codeBox);
  W.sweep=el('div','a',W.codeBox);css(W.sweep,{left:0,right:0,height:'3px',background:'linear-gradient(90deg,transparent,rgba(247,247,244,.9),transparent)',boxShadow:'0 0 16px rgba(247,247,244,.6)'});
  W.term=el('div','term',W.ed,'<div class="hd"><span style="color:#E7E5DD">TERMINAL</span><span>PROBLEMS</span><span>OUTPUT</span></div>');
  W.tl=[];for(let i=0;i<6;i++){const d=el('div',null,W.term);css(d,{padding:'0 20px',whiteSpace:'pre'});W.tl.push(d);}
  const TL=['<span style="color:#79C796">$</span> npm run dev','<span style="color:#8A877D">&gt; acme-analytics@0.1.0 dev</span>','<span style="color:#8A877D">&gt; next dev</span>','',
    '  - Local:   <span style="color:#8EC5F2">http://localhost:3000</span>','<span style="color:#79C796">✓</span> Ready in 1.4s'];
  W.tl.forEach((d,i)=>d.innerHTML=TL[i]);
  // preview pane (Cursor's browser tab) — filled by the dashboard element during the reveal
  W.prev=el('div','preview',w,'<div class="url"><span>localhost:3000/dashboard</span></div>');

function rectFromWorld(t){const[x0,y0]=worldToScreen(t,312,86),[x1,y1]=worldToScreen(t,1212,940);return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function updDash(t){
  const on=t>=C.preview&&t<C.fold+.72;show(D.clip,on);if(!on)return;
  // rect: inside the preview pane → full frame → folds down toward the cube
  const R0=rectFromWorld(Math.min(t,C.push)),F={x:0,y:0,w:1920,h:1080};const k=E.inOutQuart(P(t,C.push,C.full));
  let R={x:lerp(R0.x,F.x,k),y:lerp(R0.y,F.y,k),w:lerp(R0.w,F.w,k),h:lerp(R0.h,F.h,k)},rad=lerp(6,0,k);
  const fo=E.inOutCubic(P(t,C.fold,C.cubeMorph));
  if(fo>0){const S=300;R={x:lerp(0,960-S/2,fo),y:lerp(0,470-S/2,fo),w:lerp(1920,S,fo),h:lerp(1080,S,fo)};rad=lerp(0,40,fo);}
  // during the preview it slides in with the pane
  const pv=E.outQuart(P(t,C.preview,C.preview+.45));if(t<C.push)R.x+=(1-pv)*R.w;
  css(D.clip,{left:R.x+'px',top:R.y+'px',width:R.w+'px',height:R.h+'px',borderRadius:rad+'px',boxShadow:fo>0?'0 40px 80px -30px rgba(0,0,0,.8)':'none',opacity:1-P(t,C.fold+.45,C.fold+.7)});
  const sc=R.w/1920;
  // reveal: tilted plane with layered depth, settling flat; then a slow dolly
  const tilt=1-E.inOutCubic(P(t,C.full-.2,C.full+1.6));const dolly=lerp(1.035,1,E.inOutSine(P(t,C.full,C.s5out)));
  const tf=fo>0?`translate(${R.w/2}px,${R.h/2}px) rotateX(${fo*20}deg) rotateY(${-fo*30}deg) rotateZ(${fo*-8}deg) scale(${sc}) translate(-960px,-540px)`
               :`scale(${sc*dolly}) rotateX(${tilt*16}deg) rotateY(${-tilt*14}deg)`;
  css(D.d,{transform:tf,transformOrigin:'0 0'});
  D.cards.forEach((c,i)=>{const s=C.cards+i*.09,a=E.outQuint(P(t,s,s+.6));
    css(c.c,{transform:`translateZ(${tilt*90}px) translateY(${(1-a)*40}px)`,opacity:t<C.full?1:P(t,s,s+.15),clipPath:t<C.full?'none':`inset(0 0 ${(1-a)*100}% 0 round 20px)`});
    const cv=t<C.full?1:E.outCubic(P(t,s+.1,s+1.4));const v=c.v*cv;c.val.textContent=c.pre+(c.suf==='K'?v.toFixed(1):v.toFixed(1))+c.suf;});
  const ln=t<C.full?1:E.inOutCubic(P(t,C.line,C.line+1.4));const L=D.rvL.getTotalLength();css(D.rvL,{strokeDasharray:L,strokeDashoffset:L*(1-ln)});D.rvA.style.opacity=ln;
  css(D.rc,{transform:`translateZ(${tilt*40}px)`,opacity:t<C.full?1:P(t,C.line-.3,C.line)});css(D.bc,{transform:`translateZ(${tilt*60}px)`,opacity:t<C.full?1:P(t,C.bars-.3,C.bars)});
  D.bars.forEach((b,i)=>{const s=C.bars+i*.08;b.style.transform=`scaleY(${t<C.full?1:E.outBack(P(t,s,s+.5),1.2)})`;});
  // hover micro-interaction: a point lights up on the line
  const hv=E.outBack(P(t,C.hover,C.hover+.3),1.6)*(1-P(t,C.s5out-.3,C.s5out));const p=D.pts[22];
  css(D.dot,{left:(p[0]-8)+'px',top:(p[1]-8)+'px',transform:`scale(${hv})`});css(D.tip,{left:(p[0]-62)+'px',top:(p[1]-100)+'px',opacity:hv,transform:`translateY(${(1-hv)*8}px)`});
}

// ---------------- 6 · fold into a 3D cube → official logo → lockup ----------------
const B={};
function buildBrand(){
  B.L=el('div','L');css(B.L,{zIndex:70});
  // a real 3D cube (isometric) built from three faces in the logo's own greys
  B.c3=el('div','a',B.L);css(B.c3,{left:'960px',top:'470px',width:0,height:0,perspective:'4000px'});
  B.cube=el('div','a',B.c3);css(B.cube,{left:0,top:0,transformStyle:'preserve-3d'});
  const S=180;B.S=S;const faces=[['#E9E8E3','rotateX(90deg)'],['#8E8D88','rotateY(0deg)'],['#5C5B56','rotateY(90deg)'],['#3A3934','rotateY(180deg)'],['#3A3934','rotateY(-90deg)'],['#2B2A26','rotateX(-90deg)']];
  B.faces=faces.map(([c,r])=>{const f=el('div','a',B.cube);css(f,{left:-S/2+'px',top:-S/2+'px',width:S+'px',height:S+'px',background:c,transform:`${r} translateZ(${S/2}px)`,borderRadius:'6px'});return f;});
  B.logo=el('img','a',B.L);B.logo.src='brand/CUBE_25D.png';
  B.word=el('img','a',B.L);B.word.src='brand/WORDMARK_DARK.svg';
  B.fut=el('div','a',B.L,'THE FUTURE IS BUILT.');css(B.fut,{left:0,width:'1920px',textAlign:'center',top:'760px',fontSize:'40px',fontWeight:600,letterSpacing:'.04em'});
  B.url=el('div','a mono',B.L,'cursor.com');css(B.url,{left:0,width:'1920px',textAlign:'center',top:'830px',fontSize:'24px',color:'#B5B2A8'});
  B.disc=el('div','a mono',B.L,'Spec ad by AVE Studio · not affiliated with or endorsed by Cursor');css(B.disc,{left:0,width:'1920px',textAlign:'center',top:'1030px',fontSize:'14px',color:'#5B594F',letterSpacing:'.04em'});
  B.bg=el('div','L');css(B.bg,{zIndex:45,background:'var(--bg)'});
}
function updBrand(t){
  const on=t>=C.fold;show(B.L,on);show(B.bg,t>=C.fold+.2);if(!on)return;
  B.bg.style.opacity=P(t,C.fold+.2,C.fold+.6);
  // 3D cube rises out of the folding dashboard, spins into the isometric pose
  const c3=P(t,C.fold+.55,C.cubeMorph),k=E.outCubic(c3);show(B.c3,c3>0&&t<C.cubeMorph+.25);
  const rx=lerp(-90,-35.264,k),ry=lerp(10,-45,E.inOutCubic(c3)),sc=lerp(.6,1,k);
  css(B.cube,{transform:`rotateX(${rx}deg) rotateY(${ry}deg) scale3d(${sc},${sc},${sc})`});
  B.c3.style.opacity=(1-P(t,C.cubeMorph,C.cubeMorph+.2))*P(t,C.fold+.55,C.fold+.75);
  // official logo takes over at the same size, then rises into the vertical lockup
  const lockK=E.inOutQuart(P(t,C.lockup,C.lockup+.8));
  const Wc0=262,Wc1=214.6,cw=lerp(Wc0,Wc1,lockK),ch=cw*1601/1402;const cy=lerp(470,300+ch/2,lockK);
  const breathe=1+.01*Math.sin((t-C.cubeMorph)*3)*(1-lockK);
  css(B.logo,{left:(960-cw*breathe/2)+'px',top:(cy-ch*breathe/2)+'px',width:cw*breathe+'px',height:ch*breathe+'px',opacity:P(t,C.cubeMorph,C.cubeMorph+.2)});
  const ww=Wc1*4966/1402,wh=ww*837/4966,wy=300+Wc1*1601/1402+Wc1*265/1402;
  const wr=E.inOutCubic(P(t,C.lockup+.25,C.lockup+1.0));
  css(B.word,{left:(960-ww/2)+'px',top:wy+'px',width:ww+'px',height:wh+'px',WebkitMaskImage:`linear-gradient(90deg,#000 ${wr*120-20}%,transparent ${wr*120}%)`,opacity:wr>0?1:0,transform:`translateY(${(1-wr)*12}px)`});
  const f=E.outExpo(P(t,C.future,C.future+.7));css(B.fut,{opacity:P(t,C.future,C.future+.25),transform:`translateY(${(1-f)*18}px)`,letterSpacing:`${lerp(.16,.04,f)}em`});
  css(B.url,{opacity:P(t,C.url,C.url+.3)});css(B.disc,{opacity:P(t,C.disc,C.disc+.4)*.9});
}

// film grain
let grain;function buildGrain(){grain=el('div','L');css(grain,{zIndex:900,pointerEvents:'none',mixBlendMode:'overlay',opacity:'.045'});const tiles=[];
  for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const r=mulberry32(101+k);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);tiles.push(c.toDataURL());}grain.tiles=tiles;}
function updGrain(t){const f=Math.floor(t*C.fps);grain.style.backgroundImage=`url(${grain.tiles[f%4]})`;const r=mulberry32(f*31+7);grain.style.backgroundPosition=`${Math.floor(r()*256)}px ${Math.floor(r()*256)}px`;}

let pending=[];
async function init(){
  for(const f of['500 40px UI','600 40px UI','400 20px Mono','500 20px Mono'])await document.fonts.load(f);await document.fonts.ready;
  await Promise.all(['brand/CUBE_25D.png','brand/WORDMARK_DARK.svg'].map(src=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src=src;})));
  buildBG();buildWorld();buildCube();buildDash();buildScrim();buildSupers();buildKey();buildBrand();buildHook();buildGrain();
  window.seek=async(t)=>{pending=[];
    updBG(t,t>=C.open&&t<C.full+.2);updWorld(t);updCube(t);updDash(t);updScrim(t);updSupers(t);updKey(t);updBrand(t);updHook(t);updGrain(t);
    await Promise.all(pending);};
  const q=new URLSearchParams(location.search);
  if(q.has('t'))await window.seek(parseFloat(q.get('t')));else await window.seek(0);
  window.READY=true;
}
init().catch(e=>{window.INITERR=String(e&&e.stack||e);console.error(e);});
